services:
  - type: web
    name: mentorship-book
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
